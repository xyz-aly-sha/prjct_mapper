<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paperboard">
<meta name="theme-color" content="#ffffff">
<title>Paperboard</title>
<link rel="apple-touch-icon" id="touchIcon">
<style>
:root{
  --paper:#ffffff;--rule:#efebe4;--margin:#e2dbcf;--m:74px;--logo:#2b3bff; --line:rgba(70,95,140,.17); --ink:#2b2724; --muted:#8c8274; --soft:#b3a893;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --row:32px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.serif{font-family:ui-serif,"New York",Georgia,serif}

/* pager: swipe left/right between pages */
#pager{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overscroll-behavior-y:contain;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.lined{background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px),var(--line) var(--row));background-attachment:local}

/* overview */
.ov{min-height:100%;display:flex;flex-direction:column}
.ovtop{position:sticky;top:0;z-index:6;background:#d4d0c8;padding:calc(var(--safe-t) + 6px) 6px 6px}
.ovhead{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 5px 6px;background:#d4d0c8;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;box-shadow:inset -1px -1px 0 #808080;border-radius:7px}
.logo{display:block}
.logo img{width:46px;height:46px;display:block;-webkit-user-drag:none;-webkit-touch-callout:none}
.mini{width:40px;height:40px;display:grid;place-items:center;color:#000;background:none}
.mini:active{opacity:.5}
.mini svg{width:24px;height:24px}
.empty{color:var(--muted);font-size:14px;padding:14px 0 0 29px}
.empty:empty{display:none}

/* task lists: notebook margin line + narrow rows */
.tasks-wrap{position:relative}
.ov .tasks-wrap{flex:1;padding-bottom:calc(var(--safe-b) + 70px)}
.tasks-wrap::before{content:"";position:absolute;right:var(--m);top:0;bottom:0;width:1px;background:var(--margin);pointer-events:none;z-index:1}
.ov .tasks-wrap::before{bottom:0}
.ptasks .tasks-wrap{border-bottom:1px solid var(--rule)}
.tasklist{list-style:none;margin:0;padding:0}
.tasklist li{cursor:pointer;display:flex;align-items:center;min-height:38px;padding:4px 0;border-bottom:1px solid var(--rule);background:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.dt{width:var(--m);flex:none;align-self:stretch;display:flex;align-items:center;justify-content:flex-start;padding-left:9px;margin-left:6px;cursor:pointer;font-size:11px;letter-spacing:.03em;color:#b5ada0;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt.late{color:var(--ink);font-weight:700}
li.done .dt{color:#cfc8bd;font-weight:400}
.bul{width:4px;height:18px;border-radius:2px;background:var(--bc,var(--soft));flex:none;margin:0 11px 0 14px;transition:opacity .25s}
.bul.ghost{background:transparent}
li.done .bul{opacity:.3}
.tt{flex:1;min-width:0;padding:2px 0}
.txt{word-break:break-word;outline:none;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .3s ease,color .3s}
li.editing .txt{-webkit-user-select:text;user-select:text;display:inline-block;min-width:40px;box-shadow:0 1.5px 0 var(--bc2,var(--ink))}
li.done .txt{background-size:100% 1.6px;color:var(--muted)}
li.lift{z-index:5;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.16);border-radius:6px;border-bottom-color:transparent}
.tdel{display:none;width:30px;height:30px;border-radius:50%;place-items:center;color:var(--muted);flex:none}
.tdel svg{width:15px;height:15px}
li.done .tdel{display:grid}
.addrow{display:flex;align-items:center;min-height:44px;padding:4px 0;gap:6px}
.addrow .bul{margin-right:5px}
.addrow .dt{margin-left:0}
.addrow input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:transparent;padding:6px 0;outline:none;color:var(--ink);border-radius:0}
.addrow input::placeholder{color:#c3bcb0}
.ppill{max-width:34%;padding:6px 11px;border-radius:14px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.addbtn{width:32px;height:32px;border-radius:50%;background:var(--pc,var(--ink));color:#fff;font-size:21px;line-height:1;flex:none}

/* hold-and-drag wheel (dates, projects) */
#wheel{position:fixed;transform:translateY(-50%) scale(.92);opacity:0;pointer-events:none;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);padding:6px 16px 7px;z-index:60;transition:opacity .15s,transform .15s;min-width:118px;font-variant-numeric:tabular-nums}
#wheel.open{opacity:1;transform:translateY(-50%)}
.wl{font-size:13px;color:#c3bcb0;text-align:center;height:26px;line-height:26px;white-space:nowrap;letter-spacing:.03em}
.wl.mid{font-size:17px;font-weight:700;color:var(--ink);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);height:32px;line-height:32px}
.whint{font-size:11px;color:var(--muted);text-align:center;padding-top:3px;white-space:nowrap}

/* project page */
.topbar{position:sticky;top:0;z-index:6;background:var(--pc);color:#fff;padding:calc(var(--safe-t) + 6px) 6px 6px}
.tbox{border:0!important;box-shadow:none!important}
.tbox{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 12px;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;box-shadow:inset -1px -1px 0 rgba(0,0,0,.28)}
.pname{flex:1;min-width:0;font:700 23px/1.25 ui-serif,"New York",Georgia,serif;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.pname:focus{text-overflow:clip;overflow-x:auto}
.tbtn{width:40px;height:40px;display:grid;place-items:center;background:none;flex:none;color:#fff}
.tbtn:active{opacity:.5}
.tbtn svg{width:24px;height:24px}
.page.proj{background:#fff}
.ptasks{background:#fff}

.board{position:relative;width:100%;background:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.items{position:absolute;inset:0;z-index:1}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
body.drawmode .board{touch-action:none}
body.drawmode .items{pointer-events:none}

.item{position:absolute}
.item .content{outline:none;-webkit-user-select:text;user-select:text;white-space:pre-wrap;word-break:break-word;min-height:1.5em;caret-color:var(--ink)}
.item.text .content{font-size:19px;line-height:1.45;padding:2px 4px}
.item.text .content:empty::before{content:"Type…";color:var(--soft)}
.item.sticky .content{background:var(--sc);padding:14px 14px 18px;min-height:160px;font-size:16px;line-height:1.4;border-radius:2px 2px 12px 2px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 18px -8px rgba(70,50,10,.32)}
.item.image img{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 22px -10px rgba(60,40,10,.4);pointer-events:none;-webkit-touch-callout:none}
.item.sel{outline:1.5px dashed rgba(43,39,36,.45);outline-offset:6px}
.item .h{position:absolute;display:none;place-items:center;border-radius:50%;touch-action:none;z-index:3}
.item.sel .h{display:grid}
body.drawmode .item .h{display:none}
.grip{top:-46px;left:-8px;width:36px;height:36px;background:var(--ink);color:#fff}
.del{top:-46px;right:-8px;width:36px;height:36px;background:#fff;color:#b4372a;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rs{right:-15px;bottom:-15px;width:26px;height:26px;background:#fff;border:2px solid var(--ink)}
.h svg{width:18px;height:18px}

/* new project page */
.newp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:24px}
.newbtn{width:88px;height:88px;border-radius:50%;border:2px dashed var(--soft);font-size:42px;color:var(--muted);line-height:1}

/* toolbar */
#toolbar{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:1px;padding:5px;background:rgba(255,252,245,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;box-shadow:0 8px 24px rgba(60,45,20,.18),0 0 0 1px rgba(0,0,0,.05);z-index:20;transition:transform .25s,opacity .25s}
#toolbar.hidden{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
#toolbar button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#5b5348;flex:none}
#toolbar button.on{background:var(--ink);color:#fff}
#toolbar svg{width:20px;height:20px}
.sep{width:1px;height:22px;background:rgba(0,0,0,.12);margin:0 3px}
.cdot{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 66px);background:rgba(255,252,245,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(60,45,20,.2),0 0 0 1px rgba(0,0,0,.05);z-index:21}
#pop[hidden]{display:none}
.prow{display:flex;gap:8px;justify-content:center;align-items:center}
.prow+.prow{margin-top:12px}
.sw{width:27px;height:27px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.sw.sq{border-radius:7px}
.sw.big{width:38px;height:38px}
.sz{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.sz.on{background:rgba(0,0,0,.08)}
.sz i{display:block;border-radius:50%}

#dots{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 18px);display:flex;justify-content:center;gap:6px;pointer-events:none;z-index:15;transition:bottom .25s}
body.onproj #dots{bottom:calc(var(--safe-b) + 66px)}
body.editing #dots{opacity:0}
#dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18)}
#dots i.on{background:var(--ink)}

#toast{position:fixed;top:calc(var(--safe-t) + 72px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1}

#sheet{position:fixed;inset:0;z-index:40;background:rgba(40,30,20,.28);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;background:var(--paper);border-radius:20px 20px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);transform:translateY(30px);transition:transform .25s}
#sheet.open .panel{transform:none}
.sh-title{font:700 21px ui-serif,"New York",Georgia,serif;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:4px 0 10px}
.prow.wrap{flex-wrap:wrap;justify-content:flex-start}
.sh-row{display:flex;gap:8px;margin-top:16px}
.sh-btn{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;background:rgba(0,0,0,.045);margin-top:8px;font-size:16px}
.sh-row .sh-btn{text-align:center;margin-top:0}
.sh-btn.danger{color:#b4372a}
.sh-btn.ghost{background:none;text-align:center;font-weight:600}
.sh-note{font-size:13px;color:var(--muted);margin:14px 2px 0;line-height:1.45}
</style>
</head>
<body>
<div id="pager"></div>
<div id="dots"></div>

<div id="toolbar" class="hidden">
  <button data-tool="hand" aria-label="Scroll and select"></button>
  <button data-tool="pen" aria-label="Pen"></button>
  <button data-tool="marker" aria-label="Marker"></button>
  <button data-tool="eraser" aria-label="Eraser"></button>
  <button data-tool="text" aria-label="Text"></button>
  <button data-tool="sticky" aria-label="Sticky note"></button>
  <button id="imgBtn" aria-label="Add photo"></button>
  <span class="sep"></span>
  <button id="colorBtn" aria-label="Color and size"><span class="cdot"></span></button>
  <button id="undoBtn" aria-label="Undo"></button>
</div>
<div id="pop" hidden></div>
<div id="toast"></div>
<div id="sheet"><div class="panel"></div></div>
<input type="file" id="imgInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
(()=>{
/* ---------- constants ---------- */
const PROJ_COLORS=['#ff3b30','#0a6cff','#00a85a','#ff8a00','#8b2cff','#ff1f7a','#00a3c4','#e6b400'];
const OLD_COLORS=['#c8553d','#2f6fb0','#3a8f5c','#b9811a','#8455b5','#c4567f','#2a8f92','#5a5248'];
const INK=['#2b3bff','#ff3b30','#ff8a00','#ffc300','#00a85a','#00a3c4','#8b2cff','#ff1f7a'];
const STICKY=['#ffd60a','#ff7eb6','#5ac8fa','#5fe08a','#ff9f40'];
const SIZES={pen:[2,3.5,6],marker:[12,18,28]};
const NS='http://www.w3.org/2000/svg';
const sv=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
  hand:sv('<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>'),
  pen:sv('<path d="M4 20l1.2-4.2L16 5l3 3L8.2 18.8z"/><path d="M14 7l3 3"/>'),
  marker:sv('<path d="M8 14l8-8 4 4-8 8z"/><path d="M8 14l-2 4 4-1"/><path d="M3 21h9"/>'),
  eraser:sv('<path d="M8 20h12"/><path d="M4.6 15.4l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19.1H8.3z"/><path d="M9.2 10.8l5 5"/>'),
  text:sv('<path d="M5 7V4h14v3M12 4v16M9 20h6"/>'),
  sticky:sv('<path d="M5 4h14v10l-6 6H5z"/><path d="M13 20v-6h6"/>'),
  image:sv('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>'),
  undo:sv('<path d="M8 5L4 9l4 4"/><path d="M4 9h10a5 5 0 0 1 0 10H9"/>'),
  more:sv('<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>'),
  x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  chev:sv('<path d="M6 9l6 6 6-6"/>'),
};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- storage (IndexedDB, falls back to localStorage, then memory) ---------- */
const store={db:null,
  async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('paperboard',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  async get(){if(this.db){try{return await new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){}}
    try{const s=localStorage.getItem('paperboard');return s?JSON.parse(s):null}catch(e){return null}},
  async set(v){if(this.db){try{await new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return}catch(e){}}
    try{localStorage.setItem('paperboard',JSON.stringify(v))}catch(e){}}
};
let S={v:1,projects:[]};
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(flush,350)};
const flush=()=>{clearTimeout(saveT);store.set(S)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else if(S.projects&&purgeDone()){refreshLists();save()}});

/* ---------- UI state ---------- */
let tool='hand',inkColor=INK[0],stickyColor=STICKY[0],sizeIdx={pen:1,marker:1},curIdx=0,editing=false;
const undoStacks={};
function snap(p){const st=(undoStacks[p.id]=undoStacks[p.id]||[]);st.push({strokes:p.strokes.slice(),items:p.items.map(i=>({...i}))});if(st.length>50)st.shift()}
const pager=$('#pager');
const secOf=p=>pager.querySelector(`section[data-pid="${p.id}"]`);
const projById=id=>S.projects.find(p=>p.id===id);
function curProject(){const pg=pager.children[curIdx];return pg&&pg.dataset.pid?projById(pg.dataset.pid):null}
function findTask(id){for(const p of S.projects)for(const t of p.tasks)if(t.id===id)return[p,t];return null}

/* ---------- pager ---------- */
function renderPager(){
  pager.innerHTML='';
  pager.append(buildOverview());
  S.projects.forEach(p=>pager.append(buildProject(p)));
  pager.append(buildNew());
  renderOverview();
  $('#dots').innerHTML=Array.from(pager.children,()=>'<i></i>').join('');
}
function jumpTo(i){i=clamp(i,0,pager.children.length-1);pager.scrollLeft=i*pager.clientWidth;curIdx=i;updateChrome()}
function goTo(i){pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'})}
let rafS;pager.addEventListener('scroll',()=>{cancelAnimationFrame(rafS);rafS=requestAnimationFrame(()=>{const i=Math.round(pager.scrollLeft/pager.clientWidth);if(i!==curIdx){curIdx=i;const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();updateChrome()}})},{passive:true});
addEventListener('resize',()=>{pager.scrollLeft=curIdx*pager.clientWidth});
const recheck=()=>setTimeout(()=>{const i=Math.round(pager.scrollLeft/pager.clientWidth);curIdx=i;const a=document.activeElement;editing=!!(a&&a.matches&&a.matches('input,select,[contenteditable="true"],[contenteditable="plaintext-only"]'));document.body.classList.toggle('editing',editing);updateChrome()},350);
pager.addEventListener('scrollend',recheck);pager.addEventListener('touchend',recheck,{passive:true});
function updateChrome(){
  const pg=pager.children[curIdx],isProj=!!(pg&&pg.dataset.pid);
  $('#toolbar').classList.toggle('hidden',!isProj||editing);
  document.body.classList.toggle('onproj',isProj&&!editing);
  closePop();
  $('#dots').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===curIdx));
  if(isProj&&S.lastPid!==pg.dataset.pid){S.lastPid=pg.dataset.pid;save()}
}
document.addEventListener('focusin',e=>{if(e.target.matches('input,select,[contenteditable]')){editing=true;document.body.classList.add('editing');updateChrome()}});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches('input,select,[contenteditable]')){editing=false;document.body.classList.remove('editing');updateChrome()}},60)});

/* ---------- tasks ---------- */
const WD=['SU','MO','TU','WE','TH','FR','SA'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const fmtDate=d=>`${WD[d.getDay()]}/${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
const todayIso=()=>isoOf(new Date());
const sortedTasks=p=>p.tasks.slice().sort((a,b)=>a.order-b.order);
function allTasks(){const a=[];S.projects.forEach(p=>p.tasks.forEach(t=>a.push([p,t])));return a.sort((x,y)=>x[1].order-y[1].order)}
const maxOrder=()=>allTasks().reduce((m,[,t])=>Math.max(m,t.order||0),0);

function taskLi(t,p){
  const late=t.due&&!t.done&&t.due<todayIso();
  return `<li data-id="${t.id}" class="${t.done?'done':''}" style="--bc2:${p.color}"><span class="bul" style="--bc:${p.color}"></span><div class="tt"><span class="txt">${esc(t.text)}</span></div><button class="tdel" aria-label="Delete task">${IC.x}</button><span class="dt${late?' late':''}">${t.due?fmtDate(dateOf(t.due)):''}</span></li>`;
}
function refreshLists(){S.projects.forEach(q=>renderProjectTasks(q));renderOverview()}

/* press-and-hold helper: after the hold, the finger drags (page scrolling is blocked meanwhile) */
let gesture=null,suppressClick=0;
document.addEventListener('touchmove',e=>{if(gesture&&gesture.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(gesture)e.preventDefault()});
function longPress(root,sel,o){
  root.addEventListener('pointerdown',e=>{
    const t=e.target.closest(sel);if(!t||!root.contains(t))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(o.filter&&!o.filter(t))return;
    const g={t,sx:e.clientX,sy:e.clientY,id:e.pointerId,active:false};gesture=g;
    g.timer=setTimeout(()=>{g.active=true;o.start(g)},o.delay||430);
    const mv=ev=>{if(ev.pointerId!==g.id)return;const dx=ev.clientX-g.sx,dy=ev.clientY-g.sy;
      if(!g.active){if(Math.hypot(dx,dy)>9){clearTimeout(g.timer);done()}return}
      ev.preventDefault();o.move(g,dx,dy,ev)};
    const up=ev=>{if(ev.pointerId!==g.id)return;clearTimeout(g.timer);if(g.active){suppressClick=Date.now()+450;o.end(g)}done()};
    function done(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);if(gesture===g)gesture=null}
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

/* wheel overlay */
const wheel=el('div','','<div class="wl"></div><div class="wl mid"></div><div class="wl"></div><div class="whint"></div>');wheel.id='wheel';document.body.append(wheel);
function openWheel(anchor,hint,side){
  const r=anchor.getBoundingClientRect();
  $('.whint',wheel).textContent=hint;wheel.classList.add('open');
  const w=wheel.offsetWidth;
  const left=side==='edge'?8:side==='left'?r.left-w-14:r.right+14;
  wheel.style.left=clamp(left,8,innerWidth-w-8)+'px';
  wheel.style.top=clamp(r.top+r.height/2,90,innerHeight-90)+'px';
}
function drawWheel(rows,color){wheel.querySelectorAll('.wl').forEach((n,i)=>n.textContent=rows[i]);$('.mid',wheel).style.color=color||''}
function closeWheel(){wheel.classList.remove('open')}

function bindTaskList(ul){
  let lastId=null,lastT=0;
  ul.addEventListener('click',e=>{
    if(Date.now()<suppressClick)return;
    const del=e.target.closest('.tdel');
    if(del){e.preventDefault();lastId=null;deleteTask(del.closest('li').dataset.id);return}
    const li=e.target.closest('li');if(!li)return;
    const id=li.dataset.id,now=Date.now(),quick=id===lastId&&now-lastT<380;
    lastId=id;lastT=now;
    if(e.target.closest('.dt')){if(quick){lastId=null;toggleTask(id)}return}   // double-tap the date space = cross out
    const tx=$('.txt',li);
    if(tx.isContentEditable){if(quick){lastId=null;try{const r=document.createRange();r.selectNodeContents(tx);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(_){}}return}
    startEdit(li);                                                              // tap = edit
  });
  // hold the text, then drag up/down to reorder
  longPress(ul,'.tt',{
    filter:t=>!$('.txt',t).isContentEditable,
    start:g=>{lastId=null;const li=g.t.closest('li');g.li=li;g.top0=li.offsetTop;li.classList.add('lift')},
    move:(g,dx,dy,ev)=>{
      const li=g.li,prev=li.previousElementSibling,next=li.nextElementSibling;
      if(prev&&ev.clientY<prev.getBoundingClientRect().top+prev.offsetHeight/2)ul.insertBefore(li,prev);
      else if(next&&ev.clientY>next.getBoundingClientRect().top+next.offsetHeight/2)ul.insertBefore(next,li);
      li.style.transform=`translateY(${dy-(li.offsetTop-g.top0)}px)`;
    },
    end:g=>{g.li.style.transform='';g.li.classList.remove('lift');commitOrder(ul)}
  });
  // hold the date, then: up/down = day, right = no date, left = date on
  longPress(ul,'.dt',{
    start:g=>{lastId=null;const f=findTask(g.t.closest('li').dataset.id);g.f=f;g.on0=!!f[1].due;g.on=g.on0;g.base=f[1].due?dateOf(f[1].due):new Date();g.steps=0;
      openWheel(g.t,'↕ day   → off   ← on','edge');drawDate(g)},
    move:(g,dx,dy)=>{g.steps=Math.round(dy/28);g.on=dx>36?false:dx<-36?true:(g.steps!==0?true:g.on0);drawDate(g)},
    end:g=>{const t=g.f[1];t.due=g.on?isoOf(addDays(g.base,g.steps)):null;closeWheel();refreshLists();save()}
  });
}
function drawDate(g){
  if(!g.on){drawWheel(['','no date','']);return}
  drawWheel([-1,0,1].map(k=>fmtDate(addDays(g.base,g.steps+k))),g.f[0].color);
}
function commitOrder(ul){
  const ids=[...ul.children].map(li=>li.dataset.id).filter(Boolean);
  if(ul.id==='ovList'){ids.forEach((id,i)=>{const f=findTask(id);if(f)f[1].order=i+1})}
  else{const ts=ids.map(id=>findTask(id)).filter(Boolean).map(f=>f[1]);const vals=ts.map(t=>t.order).sort((a,b)=>a-b);ts.forEach((t,i)=>t.order=vals[i])}
  refreshLists();save();
}
function startEdit(li){
  const tx=$('.txt',li);if(tx.isContentEditable)return;
  const id=li.dataset.id,f=findTask(id);if(!f)return;
  try{tx.contentEditable='plaintext-only'}catch(_){}
  if(tx.contentEditable!=='plaintext-only')tx.contentEditable='true';
  li.classList.add('editing');tx.focus();
  try{const r=document.createRange();r.selectNodeContents(tx);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(_){}
  const key=e=>{if(e.key==='Enter'){e.preventDefault();tx.blur()}};
  const fin=()=>{
    tx.removeEventListener('keydown',key);tx.removeEventListener('blur',fin);
    tx.contentEditable='false';tx.removeAttribute('contenteditable');li.classList.remove('editing');
    if(tx.dataset.cancel){delete tx.dataset.cancel;tx.textContent=f[1].text;return}
    const v=tx.innerText.replace(/\s+/g,' ').trim();
    if(!v){deleteTask(id);return}
    if(v!==f[1].text){f[1].text=v;save();refreshLists()}else tx.textContent=v;
  };
  tx.addEventListener('keydown',key);tx.addEventListener('blur',fin);
}
function bindAdd(row,getProject){
  const inp=$('input',row),btn=$('.addbtn',row);
  const go=()=>{const v=inp.value.trim(),p=getProject();if(!v||!p)return;addTask(p,v);inp.value=''};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  btn.addEventListener('pointerdown',e=>e.preventDefault());
  btn.addEventListener('click',e=>{e.preventDefault();go();inp.focus()});
}
function addTask(p,text){p.tasks.push({id:uid(),text,done:false,created:Date.now(),order:maxOrder()+1,due:null});refreshLists();save()}
function toggleTask(id){const f=findTask(id);if(!f)return;const[p,t]=f;t.done=!t.done;t.doneAt=t.done?Date.now():null;document.querySelectorAll(`li[data-id="${id}"]`).forEach(li=>li.classList.toggle('done',t.done));save()}
function deleteTask(id){const f=findTask(id);if(!f)return;const[p,t]=f;p.tasks=p.tasks.filter(x=>x!==t);refreshLists();save()}
function purgeDone(){const cut=Date.now()-864e5;let n=0;S.projects.forEach(p=>{const l=p.tasks.length;p.tasks=p.tasks.filter(t=>!(t.done&&t.doneAt&&t.doneAt<cut));n+=l-p.tasks.length});return n}

/* ---------- board: drawing ---------- */
function pathD(P){
  if(P.length===1)return`M${P[0][0]} ${P[0][1]}l.01 0`;
  let d=`M${P[0][0]} ${P[0][1]}`;
  for(let i=1;i<P.length-1;i++){const a=P[i],b=P[i+1];d+=`Q${a[0]} ${a[1]} ${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)}`}
  const l=P[P.length-1];return d+`L${l[0]} ${l[1]}`;
}
function strokeAttrs(s){return{fill:'none',stroke:s.color,'stroke-width':s.w,'stroke-linecap':'round','stroke-linejoin':'round',...(s.tool==='marker'?{'stroke-opacity':'.4',style:'mix-blend-mode:multiply'}:{})}}
function strokeMarkup(s){const a=strokeAttrs(s);return`<path data-id="${s.id}" d="${pathD(s.pts)}" ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`}
function ensureHeight(p){
  let b=0;for(const s of p.strokes)for(const q of s.pts)if(q[1]>b)b=q[1];
  for(const it of p.items)b=Math.max(b,it.y+(it.type==='image'?it.w*(it.ar||1):200));
  p.height=Math.max(p.height||0,2400,b+1000);
}
function renderBoard(p,sec=secOf(p)){
  ensureHeight(p);
  const board=$('.board',sec);board.style.height=p.height+'px';
  $('.ink',sec).innerHTML=p.strokes.map(strokeMarkup).join('');
  const box=$('.items',sec);box.innerHTML='';p.items.forEach(it=>box.append(buildItem(p,sec,it)));
}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function hitStroke(s,x,y,r){const P=s.pts;if(P.length===1)return Math.hypot(P[0][0]-x,P[0][1]-y)<=r;for(let i=1;i<P.length;i++)if(segDist(x,y,P[i-1],P[i])<=r)return true;return false}
const isDraw=()=>tool==='pen'||tool==='marker'||tool==='eraser';

function bindBoard(p,sec){
  const board=$('.board',sec),svg=$('.ink',sec);
  const ptrs=new Map();let cur=null,path=null,pan=null,tap=null,erased=false;
  const pos=e=>{const r=board.getBoundingClientRect();return[Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10]};
  const avg=()=>{let s=0;for(const v of ptrs.values())s+=v;return s/ptrs.size};
  const evs=e=>(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  function eraseAt([x,y]){
    const hit=p.strokes.filter(s=>hitStroke(s,x,y,11+s.w/2));if(!hit.length)return;
    if(!erased){snap(p);erased=true}
    const ids=new Set(hit.map(s=>s.id));p.strokes=p.strokes.filter(s=>!ids.has(s.id));
    ids.forEach(id=>{const n=svg.querySelector(`[data-id="${id}"]`);if(n)n.remove()});save();
  }
  board.addEventListener('pointerdown',e=>{
    closePop();
    if(!isDraw()){if(e.target.closest('.item'))return;tap={x:e.clientX,y:e.clientY};return}
    if(e.pointerType==='mouse'&&e.button!==0)return;
    e.preventDefault();try{board.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,e.clientY);
    if(ptrs.size>=2){if(path)path.remove();cur=path=null;pan={y:avg(),top:sec.scrollTop};return}
    if(tool==='eraser'){erased=false;eraseAt(pos(e));return}
    cur={id:uid(),tool,color:inkColor,w:SIZES[tool][sizeIdx[tool]],pts:[pos(e)]};
    path=document.createElementNS(NS,'path');
    for(const[k,v]of Object.entries(strokeAttrs(cur)))path.setAttribute(k,v);
    path.setAttribute('d',pathD(cur.pts));svg.append(path);
  });
  board.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,e.clientY);
    if(pan){sec.scrollTop=pan.top-(avg()-pan.y);return}
    if(tool==='eraser'){evs(e).forEach(ev=>eraseAt(pos(ev)));return}
    if(!cur)return;
    for(const ev of evs(e)){const q=pos(ev),l=cur.pts[cur.pts.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>=1.2)cur.pts.push(q)}
    path.setAttribute('d',pathD(cur.pts));
    const ly=cur.pts[cur.pts.length-1][1];if(ly>p.height-500){p.height=ly+1200;board.style.height=p.height+'px'}
  });
  const end=e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(pan){pan=ptrs.size?{y:avg(),top:sec.scrollTop}:null;return}
    if(cur){snap(p);p.strokes.push(cur);path.dataset.id=cur.id;cur=path=null;save()}
  };
  board.addEventListener('pointerup',e=>{end(e);if(tap&&!isDraw()&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<10)boardTap(p,sec,pos(e));tap=null});
  board.addEventListener('pointercancel',e=>{end(e);tap=null});
}
function boardTap(p,sec,[x,y]){
  if(tool==='text')createItem(p,sec,'text',x,y);
  else if(tool==='sticky')createItem(p,sec,'sticky',x,y);
  else{selectItem(sec,null);const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur()}
}

/* ---------- board: items (text, sticky, image) ---------- */
function selectItem(sec,id){sec.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));if(id){const d=sec.querySelector(`[data-iid="${id}"]`);if(d)d.classList.add('sel')}}
function place(d,it){d.style.left=it.x+'px';d.style.top=it.y+'px';d.style.width=it.w+'px'}
function dragHandle(h,start,move,done){
  h.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();try{h.setPointerCapture(e.pointerId)}catch(_){}
    const sx=e.clientX,sy=e.clientY;start();
    const mv=ev=>move(ev.clientX-sx,ev.clientY-sy);
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);done()};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}
function buildItem(p,sec,it){
  const d=el('div','item '+it.type);d.dataset.iid=it.id;place(d,it);
  if(it.type==='image'){const img=el('img');img.src=it.src;img.alt='';img.draggable=false;d.append(img)}
  else{
    const c=el('div','content');
    try{c.contentEditable='plaintext-only'}catch(_){c.contentEditable='true'}
    if(c.contentEditable!=='plaintext-only')c.contentEditable='true';
    c.textContent=it.text||'';
    if(it.type==='sticky')d.style.setProperty('--sc',it.color);else c.style.color=it.color;
    c.addEventListener('input',()=>{it.text=c.innerText;save()});
    c.addEventListener('blur',()=>{if(it.type==='text'&&!c.innerText.trim()){p.items=p.items.filter(i=>i!==it);d.remove();save()}});
    d.append(c);
  }
  d.insertAdjacentHTML('beforeend',`<button class="h grip" aria-label="Move">${IC.hand}</button><button class="h del" aria-label="Delete">${IC.x}</button><span class="h rs" aria-label="Resize"></span>`);
  d.addEventListener('pointerdown',()=>selectItem(sec,it.id));
  const board=$('.board',sec);
  let ox,oy,ow;
  dragHandle($('.grip',d),()=>{snap(p);ox=it.x;oy=it.y},(dx,dy)=>{it.x=clamp(ox+dx,0,board.clientWidth-40);it.y=Math.max(0,oy+dy);place(d,it)},()=>{ensureHeight(p);board.style.height=p.height+'px';save()});
  dragHandle($('.rs',d),()=>{snap(p);ow=it.w},(dx)=>{it.w=clamp(ow+dx,70,board.clientWidth-it.x);place(d,it)},()=>{ensureHeight(p);board.style.height=p.height+'px';save()});
  $('.del',d).addEventListener('click',e=>{e.stopPropagation();snap(p);p.items=p.items.filter(i=>i!==it);d.remove();save()});
  return d;
}
function createItem(p,sec,type,x,y,extra={}){
  const board=$('.board',sec),bw=board.clientWidth;
  snap(p);
  const w=type==='sticky'?170:type==='image'?Math.min(260,bw-40):Math.min(240,bw-24);
  const it={id:uid(),type,x:clamp(type==='text'?x-6:x-w/2,8,Math.max(8,bw-w-8)),y:Math.max(56,y-(type==='text'?18:30)),w,...extra};
  if(type==='text'){it.text='';it.color=inkColor}
  if(type==='sticky'){it.text='';it.color=stickyColor}
  p.items.push(it);ensureHeight(p);board.style.height=p.height+'px';
  const d=buildItem(p,sec,it);$('.items',sec).append(d);selectItem(sec,it.id);
  if(type!=='image')$('.content',d).focus();
  setTool('hand');save();return it;
}
function downscale(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res({src:c.toDataURL('image/jpeg',.84),ar:h/w})};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function addImages(files){
  const p=curProject();if(!p)return;const sec=secOf(p),board=$('.board',sec);let k=0;
  for(const f of files){try{const{src,ar}=await downscale(f,1400);const y=Math.max(20,sec.scrollTop-board.offsetTop+140)+k*40;createItem(p,sec,'image',board.clientWidth/2+k*16,y,{src,ar});k++}catch(e){toast("Couldn't load that image")}}
}

/* ---------- toolbar ---------- */
const tb=$('#toolbar');
tb.querySelectorAll('[data-tool]').forEach(b=>b.innerHTML=IC[b.dataset.tool]);
$('#imgBtn').innerHTML=IC.image;$('#undoBtn').innerHTML=IC.undo;
function setTool(t){
  tool=t;document.body.classList.toggle('drawmode',isDraw());
  tb.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('.cdot').style.background=t==='sticky'?stickyColor:inkColor;
  if(isDraw()){const p=curProject();if(p)selectItem(secOf(p),null)}
  if(!$('#pop').hidden)renderPop();
}
tb.addEventListener('click',e=>{
  const b=e.target.closest('[data-tool]');
  if(b){const t=b.dataset.tool;if(t===tool&&(t==='pen'||t==='marker'||t==='sticky')){togglePop();return}setTool(t);closePop();
    if(t==='text')toast('Tap the board to write');if(t==='sticky')toast('Tap the board to place a note');if(t==='pen'||t==='marker')toast('Two fingers to scroll while drawing');}
});
$('#imgBtn').addEventListener('click',()=>{closePop();$('#imgInput').click()});
$('#imgInput').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)addImages(f)});
$('#undoBtn').addEventListener('click',()=>{const p=curProject();if(!p)return;const st=undoStacks[p.id];if(!st||!st.length){toast('Nothing to undo');return}const s=st.pop();p.strokes=s.strokes;p.items=s.items;renderBoard(p);save()});
$('#colorBtn').addEventListener('click',togglePop);
function togglePop(){const pop=$('#pop');if(pop.hidden){renderPop();pop.hidden=false}else pop.hidden=true}
function closePop(){$('#pop').hidden=true}
function renderPop(){
  const pop=$('#pop');
  if(tool==='sticky'){pop.innerHTML=`<div class="prow">${STICKY.map(c=>`<button class="sw sq${c===stickyColor?' on':''}" data-sc="${c}" style="background:${c}"></button>`).join('')}</div>`;return}
  const k=tool==='marker'?'marker':'pen';
  pop.innerHTML=`<div class="prow">${INK.map(c=>`<button class="sw${c===inkColor?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="prow">${SIZES[k].map((w,i)=>{const z=k==='marker'?8+i*5:Math.round(w*2.2+3);return`<button class="sz${i===sizeIdx[k]?' on':''}" data-sz="${i}"><i style="width:${z}px;height:${z}px;background:${inkColor};${k==='marker'?'opacity:.45':''}"></i></button>`}).join('')}</div>`;
}
$('#pop').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sc){stickyColor=b.dataset.sc}
  else if(b.dataset.c){inkColor=b.dataset.c;if(!(tool==='pen'||tool==='marker'||tool==='text'))setTool('pen')}
  else if(b.dataset.sz){sizeIdx[tool==='marker'?'marker':'pen']=+b.dataset.sz}
  $('.cdot').style.background=tool==='sticky'?stickyColor:inkColor;renderPop();
});

/* ---------- sheets ---------- */
const sheet=$('#sheet');
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
function openSheet(html,onClick){const pn=$('.panel',sheet);pn.innerHTML=html;pn.onclick=e=>{const b=e.target.closest('button');if(!b)return;if('close'in b.dataset){closeSheet();return}onClick(b,pn)};sheet.classList.add('open')}
function closeSheet(){sheet.classList.remove('open')}
function projectSheet(p){
  openSheet(`<div class="sh-title">${esc(p.name)}</div><div class="sh-label">Top bar color</div>
    <div class="prow wrap">${PROJ_COLORS.map(c=>`<button class="sw big${c===p.color?' on':''}" data-pc="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="sh-row"><button class="sh-btn" data-mv="-1">← Move left</button><button class="sh-btn" data-mv="1">Move right →</button></div>
    <button class="sh-btn danger" data-del>Delete project</button><button class="sh-btn ghost" data-close>Done</button>`,
  (b,pn)=>{
    if(b.dataset.pc){p.color=b.dataset.pc;secOf(p).style.setProperty('--pc',p.color);refreshLists();pn.querySelectorAll('[data-pc]').forEach(x=>x.classList.toggle('on',x===b));save()}
    else if(b.dataset.mv){const i=S.projects.indexOf(p),j=i+(+b.dataset.mv);if(j<0||j>=S.projects.length)return;S.projects.splice(i,1);S.projects.splice(j,0,p);renderPager();jumpTo(j+1);save()}
    else if('del'in b.dataset){if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Tap again to delete the board and its tasks';return}
      const i=S.projects.indexOf(p);S.projects.splice(i,1);delete undoStacks[p.id];closeSheet();renderPager();jumpTo(Math.min(i+1,S.projects.length));save()}
  });
}
let importArmed=false;
function ovSheet(){
  importArmed=false;
  openSheet(`<div class="sh-title">Paperboard</div>
    <button class="sh-btn" data-a="clear">Remove crossed-out tasks</button>
    <button class="sh-btn" data-a="export">Export backup</button>
    <button class="sh-btn" data-a="import">Import backup</button>
    <p class="sh-note">Use it like an app: open the page in Safari, tap Share → “Add to Home Screen”. Everything is saved on this phone only, so export a backup now and then.</p>
    <button class="sh-btn ghost" data-close>Done</button>`,
  b=>{
    const a=b.dataset.a;
    if(a==='clear'){let n=0;S.projects.forEach(p=>{const l=p.tasks.length;p.tasks=p.tasks.filter(t=>!t.done);n+=l-p.tasks.length;});refreshLists();save();closeSheet();toast(n?`Removed ${n} task${n>1?'s':''}`:'Nothing crossed out')}
    else if(a==='export')exportBackup();
    else if(a==='import'){if(!importArmed){importArmed=true;b.textContent='Tap again — this replaces everything on this phone';return}closeSheet();$('#importInput').click()}
  });
}
async function exportBackup(){
  const json=JSON.stringify(S),name=`paperboard-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([json],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Paperboard backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('Backup saved')}catch(e){toast('Export is not available here')}
}
$('#importInput').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects))throw 0;
    d.projects.forEach(p=>{p.tasks=(p.tasks||[]).map((t,i)=>({...t,order:t.order??(t.created||i)}));p.strokes=p.strokes||[];p.items=(p.items||[]).map(i=>({...i,text:i.text==null?'':String(i.text)}))});
    S=d;renderPager();jumpTo(0);flush();toast('Backup imported')}catch(_){toast("That file isn't a Paperboard backup")}
});

    {id:uid(),name:'Welcome',color:PROJ_COLORS[0],created:n,height:2400,strokes:[],
      tasks:[{id:uid(),text:'Double-tap the date space to cross out',done:false,created:n,order:1,due:td},
             {id:uid(),text:'Tap to edit · hold and drag to move',done:false,created:n,order:2,due:null},
             {id:uid(),text:'Hold the date space: ↕ day, → off, ← on',done:false,created:n,order:3,due:null}],
      items:[{id:uid(),type:'sticky',x:18,y:36,w:180,color:STICKY[0],text:'Swipe left / right to switch projects.\n\nPick the pen below to draw — two fingers scroll while drawing.'},
             {id:uid(),type:'text',x:24,y:260,w:300,color:INK[0],text:'Tap T, then tap the board to write.\nTap the name above to rename.'}]},
    {id:uid(),name:'Ideas',color:PROJ_COLORS[1],created:n+1,height:2400,strokes:[],items:[],
      tasks:[{id:uid(),text:'Collect references',done:false,created:n+2,order:4,due:null}]}
  ]};
}
function makeIcon(){try{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.drawImage(img,0,0,180,180);$('#touchIcon').href=c.toDataURL('image/png')};
  img.src=LOGO_SRC;
}catch(e){}}
(async()=>{
  await store.init();
  let d=null;try{d=await store.get()}catch(e){}
  S=(d&&Array.isArray(d.projects))?d:sample();
  S.projects.forEach(p=>{const i=OLD_COLORS.indexOf(p.color);if(i>=0)p.color=PROJ_COLORS[i]});
  // older saves: give tasks an order and a done-time
  const flat=[];S.projects.forEach(p=>p.tasks.forEach(t=>flat.push(t)));
  if(flat.some(t=>t.order==null)){flat.sort((a,b)=>(a.created||0)-(b.created||0)).forEach((t,i)=>t.order=i+1)}
  flat.forEach(t=>{if(t.done&&!t.doneAt)t.doneAt=Date.now();if(t.due===undefined)t.due=null});
  purgeDone();
  renderPager();jumpTo(0);setTool('hand');makeIcon();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
})();
</script>
